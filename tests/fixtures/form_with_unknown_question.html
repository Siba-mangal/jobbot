<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply — Backend Engineer</title></head>
<body>
<form id="application_form">
  <label for="first_name">First Name *</label>
  <input type="text" id="first_name" name="first_name" required>

  <label for="email">Email *</label>
  <input type="email" id="email" name="email" required>

  <!-- Required, and nothing in profile.yaml answers it. The application must
       park here rather than have anything invent a value. -->
  <label for="clearance">Security clearance level *</label>
  <input type="text" id="clearance" name="clearance" required>

  <button type="submit" id="submit_app">Submit Application</button>
</form>
</body>
</html>
